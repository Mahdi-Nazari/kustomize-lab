apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ../../base/charts/nginx-25.2.13

helmCharts:
  - name: nginx
    releaseName: kustomize-nginx-development
    namespace: kustomize-helm-development
    valuesFile: values.yaml

patches:
  - path: deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-nginx-development
