apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-lab-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Mahdi-Nazari/kustomize-lab.git
    targetRevision: main
    path: 08-argocd-integration/argocd-applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
    syncOptions:
      - PruneLast=true
