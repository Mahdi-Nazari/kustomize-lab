apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ksops-development
  namespace: argocd

spec:
  project: kustomize-lab

  source:
    repoURL: https://github.com/Mahdi-Nazari/kustomize-lab.git
    targetRevision: main
    path: 10-ksops

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-development

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
