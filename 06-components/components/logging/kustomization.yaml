apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - logging-config.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nginx
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
      spec:
        template:
          spec:
            containers:
              - name: nginx
                env:
                  - name: LOGGING_ENABLED
                    value: "true"
